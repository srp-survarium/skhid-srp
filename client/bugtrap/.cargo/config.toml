[build]
# Windows 7 and later, as the game: the `i686-pc-windows-msvc` standard
# library asks for Windows 10. Its standard library is built here
# (`build-std` below, from the toolchain's `rust-src`).
target = "i686-win7-windows-msvc"

[target.i686-win7-windows-msvc]
linker = "rust-lld"
# Microsoft's C runtime linked in (`+crt-static`: libcmt, as `cl /MT`), from
# SKHID_MSVC_LIB (build.rs), so the DLL needs no runtime DLL beside it.
#
# Reproducible: /Brepro stamps the DLL with a hash of its content, not the time,
# and /DEBUG:NONE writes no PDB. A PDB names the linker's command line, which
# for a DLL holds a temporary folder of a random name, and the build folder;
# the DLL's stamp and PDB identity would follow it (check-reproducible.sh).
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=/Brepro",
    "-C", "link-arg=/DEBUG:NONE",
    # Microsoft's libraries name PDBs of their own, which are not here.
    "-C", "link-arg=/IGNORE:4099",
    "-C", "link-arg=/SUBSYSTEM:WINDOWS,6.1",
]

# No build folder, home folder or toolchain store path in the program's
# panic locations: the standard library's sources are /rustc/<commit>/,
# a crate of the registry its name and version, this crate's files src/.
[profile.release]
trim-paths = "all"

[unstable]
build-std = ["std", "panic_abort"]
trim-paths = true
