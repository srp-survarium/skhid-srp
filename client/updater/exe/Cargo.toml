[package]
name = "skhid-updater"
version = "0.3.0"
edition = "2024"

# The updater the patched 0.26g launcher starts in the place of the game's
# own survarium_updater.exe. A 32-bit Windows program without the Rust
# standard library or a C runtime, like ../../bugtrap.

[[bin]]
name = "updater_skhid"
path = "src/main.rs"

[dependencies]
updater_logic = { package = "skhid-updater-logic", path = "../logic" }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Networking_WinHttp", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_Environment", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
