# Builds and tests everything that builds on Linux: the three servers
# (srp-0100b, srp-021d, srp-026g), the players' BugTrap.dll and
# updater_skhid.exe (cross-built for i686 Windows with rust-lld), and, on
# `main` and on every tag pushed, the 0.26g server's Docker image into this
# repository's packages (ghcr.io); on a tag, also all of the builds as assets
# of that tag's GitHub release. Nothing here deploys: the live host is updated
# by release/release.sh, the test host by deploy-test.yml.
#
# Nightly Rust, as srp-026g/flake.nix: the workspaces' scripts use
# #![feature(...)] gates and the client programs build core with build-std.
# rustlang/rust:nightly-bookworm is buildpack-deps, which has pkg-config,
# libssl-dev and a C compiler.
name: Build
on:
  # Pull requests, `main` and every new tag (a release's `026g-rev<n>`, or
  # the tag a GitHub release creates); another branch by hand (Actions ->
  # Build -> Run workflow).
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to a PR stops its run still going; `main`'s all finish.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The servers' openssl crate links the image's libssl-dev.
  OPENSSL_NO_VENDOR: "1"

jobs:
  # One job per server workspace; each is a complete workspace of its own.
  server:
    name: server ${{ matrix.workspace }} (${{ matrix.step }})
    runs-on: ubuntu-latest
    container: rustlang/rust:nightly-bookworm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        workspace: [srp-0100b, srp-021d, srp-026g]
        step: [build, test]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry/index/
            /usr/local/cargo/registry/cache/
            /usr/local/cargo/git/db/
            ${{ matrix.workspace }}/target/
          key: ${{ matrix.workspace }}-${{ matrix.step }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.workspace)) }}
          restore-keys: ${{ matrix.workspace }}-${{ matrix.step }}-
      - run: rustc -Vv && cargo -V
      - if: matrix.step == 'build'
        run: cargo build --locked --release --workspace
      - if: matrix.step == 'test'
        run: cargo test --locked --workspace
      - if: matrix.step == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.workspace }}-srp
          path: ${{ matrix.workspace }}/target/release/srp
          retention-days: 14

  # BugTrap.dll and updater_skhid.exe, the programs the players' ZIP ships.
  # build-std needs rust-src; rust-lld is in the toolchain's sysroot, which
  # the build scripts put on PATH. The updater's logic is a library with no
  # Windows in it, so its tests run here (the exe's own need Windows or Wine).
  client:
    runs-on: ubuntu-latest
    container: rustlang/rust:nightly-bookworm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry/index/
            /usr/local/cargo/registry/cache/
            client/bugtrap/target/
            client/updater/target/
            client/updater/exe/target/
            client/updater/tests/fake_exe/target/
          key: client-${{ hashFiles('client/**/Cargo.lock') }}
          restore-keys: client-
      - run: rustc -Vv && cargo -V && rustup component add rust-src
      - run: bash client/bugtrap/build.sh
      - run: bash client/updater/build.sh
      - run: cargo test --locked
        working-directory: client/updater/logic
      - run: |
          mkdir -p out
          cp client/bugtrap/target/i686-pc-windows-msvc/release/BugTrap.dll out/
          cp client/updater/exe/target/i686-pc-windows-msvc/release/updater_skhid.exe out/
          cd out && sha256sum BugTrap.dll updater_skhid.exe | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: client
          path: out/
          retention-days: 14

  # The 0.26g server's image (srp-026g/Dockerfile) as
  # ghcr.io/<owner>/<repo>/srp-026g:<sha> and, from `main`, :latest; from a
  # tag, :<tag> instead of :latest.
  image:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs: server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/srp-026g" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: srp-026g
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # On a tag, the servers' and client's builds as assets of that tag's GitHub
  # release (created if the tag has none yet; files already there are
  # replaced). Each server's `srp` is renamed after its workspace.
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [server, client]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          mkdir -p assets
          for ws in srp-0100b srp-021d srp-026g; do
            cp "artifacts/$ws-srp/srp" "assets/$ws-srp"
          done
          cp artifacts/client/BugTrap.dll artifacts/client/updater_skhid.exe assets/
          cd assets
          sha256sum srp-0100b-srp srp-021d-srp srp-026g-srp BugTrap.dll updater_skhid.exe | tee SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          fail_on_unmatched_files: true
