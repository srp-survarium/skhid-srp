[package]
name = "match-server"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
# TEST ONLY (grid-record.md J0): the jump test for the real client. Off by default, so normal and live builds do not compile it.
jump-test = []
# TEST ONLY (`bots/client_tests`): the client-test runner, inert unless `SRP_CLIENT_TEST=<plan>` is set on a local server. Off by
# default, so normal and live builds do not compile it, and a server built without it refuses to start with the variable set.
client-test = []

[dependencies]
crc32fast = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
# The maps the server's bots path on (`v026g::bots::maps`).
mapdata = { path = "../../crates/mapdata" }
# SHA-256 of a replay file (`v026g::replay`): its sidecar, the updater's check.
openssl = { workspace = true }
serde_json = { workspace = true }

session = { workspace = true }
survarium = { workspace = true }
udp-transport = { workspace = true }
vostok = { workspace = true }

# The replay conversion thread runs at nice 19 (`v026g::replay`).
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# Sessions without a sign-in, for the tests (`SessionStore::create_session`).
session = { workspace = true, features = ["test-support"] }
# A patched copy of the game data (`GameData::laid_over`, `weapons::fixtures`) for the
# test that a patched value reaches the bots' numbers (`bots::tests::weapon_data`).
survarium ={ workspace = true, features = ["fixtures", "test-support"] }
