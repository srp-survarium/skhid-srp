[package]
name = "match-server"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
crc32fast = { workspace = true }
# The voice wire's channel byte, as the games' DLL has it (`v026g::voice`).
voice-abi = { path = "../../crates/voice-abi" }
log = { workspace = true }
serde = { workspace = true }
# The maps the server's bots path on (`v026g::bots::maps`).
mapdata = { path = "../../crates/mapdata" }
# SHA-256 of a replay file (`v026g::replay`): its sidecar, the updater's check.
openssl = { workspace = true }
serde_json = { workspace = true }
# `srp-history-backfill`: a copy of srp.db and the bundle it writes.
rusqlite = { workspace = true }

session = { workspace = true }
survarium = { workspace = true }
udp-transport = { workspace = true }
vostok = { workspace = true }
# What a game could load of an uploaded world (`game.rs::uploaded`): the
# check the game itself runs (exe patch 87), one crate for both.
world-frame = { workspace = true }
srp-validate = { workspace = true }
# The files a match checks (`resource_checks`), as the game data names them.
resources-db = { workspace = true }
# Artifact Hunt's rule: its end in a trusted world (`game.rs::observe`).
artefact-hunt-rule = { workspace = true }
# Client patch 85's pickup command, checked as the clients check it.
weapon-pickup = { path = "../../crates/weapon-pickup" }
# Client patch 180's throw-back command (Return to Sender), checked against the kits' skills.
technical-skills = { path = "../../crates/technical-skills" }

# The replay conversion thread runs at nice 19 (`v026g::replay`).
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# Sessions without a sign-in, for the tests (`SessionStore::create_session`).
session = { workspace = true, features = ["test-support"] }

# Exercise the shipped codec/jitter implementation through the real voice relay.
skhid-voice = { path = "../../client-voice" }
