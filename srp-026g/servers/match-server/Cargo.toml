[package]
name = "match-server"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
crc32fast = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
# The maps the server's bots path on (`v026g::bots::maps`).
mapdata = { path = "../../crates/mapdata" }
serde_json = { workspace = true }
# SHA-256 of a recording, of Save's file (its sidecar, the updater's check)
# and of the executable reports (`v026g::record`, `v026g::replay`,
# `v026g::executable`), and the voice relay's keys (`v026g::voice`).
openssl = { workspace = true }

# The replay viewer's notes and requests (`v026g::game::playback`), one
# encoding with the game's arena.
replay-control = { workspace = true }
session = { workspace = true }
survarium = { workspace = true }
udp-transport = { workspace = true }
vostok = { workspace = true }
# What a game could load of an uploaded world (`game.rs::uploaded`): the
# check the game itself runs (exe patch 87), one crate for both.
world-frame = { workspace = true }
srp-validate = { workspace = true }
# Client patch 85's pickup command, checked as the clients check it.
weapon-pickup = { path = "../../crates/weapon-pickup" }

# A replay session's recording is read at nice 19 (`v026g::replay`).
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# Sessions without a sign-in, for the tests (`SessionStore::create_session`).
session = { workspace = true, features = ["test-support"] }

# Exercise the shipped codec/jitter implementation through the real voice relay.
skhid-voice = { path = "../../client-voice" }
