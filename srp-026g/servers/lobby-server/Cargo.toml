[package]
name = "lobby-server"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
default = []

[dependencies]
bytemuck = { workspace = true }
openssl = { workspace = true }
thiserror = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }

session = { workspace = true }
vostok = { workspace = true }
# The bots' map files' names (`rooms::BotMaps`), as the match server reads them.
mapdata = { path = "../../crates/mapdata" }
survarium = { workspace = true }
udp-transport = { workspace = true }

[dev-dependencies]
# Sessions without a sign-in, for the tests (`SessionStore::create_session`).
session = { workspace = true, features = ["test-support"] }
