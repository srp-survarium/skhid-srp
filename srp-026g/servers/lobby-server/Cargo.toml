[package]
name = "lobby-server"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
default = []
# TEST ONLY (`match-server`'s `bots/client_tests`): a hook that lets a client test choose the roles of a Player vs Bots match's server
# bots (`client_test.rs`). Not compiled without it: the lobby forms a match exactly as before.
client-test = []

[dependencies]
env_logger = { workspace = true }
log = { workspace = true }

session = { workspace = true }
vostok = { workspace = true }
survarium = { workspace = true }
udp-transport = { workspace = true }

[dev-dependencies]
# Sessions without a sign-in, for the tests (`SessionStore::create_session`).
session = { workspace = true, features = ["test-support"] }
