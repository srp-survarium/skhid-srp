[package]
name = "web-server"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
log = { workspace = true }
# SHA-1: the digest the 0.26g client gives for a password.
openssl = { workspace = true }
# The URLs the players' updater takes (`server::is_url`), for `mirrors.tsv`.
resources-db = { workspace = true }
# The stats API's answers (`history`).
serde_json = { workspace = true }

session = { workspace = true }
survarium = { workspace = true }
vostok = { workspace = true }

[dev-dependencies]
# Sessions without a sign-in, for the tests (`SessionStore::create_session`).
session = { workspace = true, features = ["test-support"] }
