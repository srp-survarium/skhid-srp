<!doctype html>
<html lang="{{LANG}}">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Survarium Maps</title>
<style>
@font-face { font-family: "PT Sans"; font-weight: 400; font-style: normal; font-display: swap; src: url("/damage/fonts/pt-sans-regular.woff2?v=19379b36559b") format("woff2"); }
@font-face { font-family: "PT Sans"; font-weight: 700; font-style: normal; font-display: swap; src: url("/damage/fonts/pt-sans-bold.woff2?v=543ae6522ad2") format("woff2"); }
@font-face { font-family: "PT Sans"; font-weight: 400; font-style: italic; font-display: swap; src: url("/damage/fonts/pt-sans-italic.woff2?v=389e5d5b0e26") format("woff2"); }
@font-face { font-family: "PT Sans Narrow"; font-weight: 400; font-style: normal; font-display: swap; src: url("/damage/fonts/pt-sans-narrow-regular.woff2?v=2091dd2f4f21") format("woff2"); }
@font-face { font-family: "PT Sans Narrow"; font-weight: 700; font-style: normal; font-display: swap; src: url("/damage/fonts/pt-sans-narrow-bold.woff2?v=6595d92f7c3b") format("woff2"); }
@font-face { font-family: "PT Mono"; font-weight: 400; font-style: normal; font-display: swap; src: url("/damage/fonts/pt-mono-regular.woff2?v=3124350adfce") format("woff2"); }
@font-face { font-family: "Carlito"; font-weight: 700; font-style: normal; font-display: swap; src: url("/damage/fonts/carlito-bold.woff2?v=1e90d27fe705") format("woff2"); }
/* The damage calculator's look: field-manual paper, the HUD's dark ground for the map. */
:root {
  --bg: #e9e6dc; --panel: #f5f3ec; --ink: #1f2420; --ink-2: #4d544c; --ink-3: #7b8277; --rule: #c9c5b6;
  --accent: #b4501f; --hud-bg: #24272a; --hud-ink: #bccbcb;
  --team0: #3b82f6; --team1: #e5484d; --team-x: #9aa0a6; --battery: #f2c94c; --charger: #d946ef; --link: #f2c94c;
  --font-display: "PT Sans Narrow", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "PT Sans", "Segoe UI", Roboto, sans-serif;
  --font-data: "PT Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #171a17; --panel: #1f231f; --ink: #e6e4da; --ink-2: #b4b6a8; --ink-3: #868a7e; --rule: #353a33;
  --accent: #e07a43; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #171a17; --panel: #1f231f; --ink: #e6e4da; --ink-2: #b4b6a8; --ink-3: #868a7e; --rule: #353a33;
  --accent: #e07a43; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 14px }
h1 { font: 700 2.1rem/1.05 var(--font-display); margin: 0; letter-spacing: .01em }
header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between;
  border-bottom: 2px solid var(--ink); padding-bottom: 12px }
.stamp { font: .78rem var(--font-data); color: var(--ink-3) }
.lbl { font: 700 .74rem var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-right: 4px }
.bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.chip { font: .85rem var(--font-body); border: 1px solid var(--rule); background: var(--panel); color: var(--ink-2);
  padding: 4px 11px; border-radius: 999px; cursor: pointer }
.chip:hover { border-color: var(--ink-3); color: var(--ink) }
.chip[aria-pressed=true] { background: var(--ink); color: var(--panel); border-color: var(--ink) }
.sep { width: 1px; align-self: stretch; background: var(--rule); margin: 0 6px }
@media (max-width: 700px) { .sep { flex-basis: 100%; height: 0; width: auto; margin: 0 } }
.layer { display: inline-flex; align-items: center; gap: 7px; font: .85rem var(--font-body); color: var(--ink-2);
  border: 1px solid var(--rule); background: var(--panel); padding: 3px 10px 3px 6px; border-radius: 2px; cursor: pointer; opacity: .55 }
.layer:hover { opacity: .8 }
.layer[aria-pressed=true] { opacity: 1; border-color: var(--ink-3); color: var(--ink) }
.layer[hidden] { display: none }
.layer svg, .layer img { width: 22px; height: 22px; display: block; object-fit: contain }
.layer b { font: 400 .8rem var(--font-data); color: var(--ink-3) }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.stage { position: relative; background: var(--hud-bg); border: 1px solid var(--rule); overflow: hidden;
  height: min(80vh, calc(100vw - 32px)); min-height: 320px }
.stage svg { width: 100%; height: 100%; display: block; user-select: none }
.note { font-size: .8rem; color: var(--ink-3); margin: 0 }
.mk { cursor: default }
</style>
<!--SITE-HEADER-->
<div class="wrap">
  <header class="top"><h1 id="title">Maps</h1><div class="stamp" id="stamp"></div></header>
  <div class="bar" id="maps" role="group"></div>
  <div class="bar"><span id="modes" class="bar" role="group"></span><span class="sep"></span><span id="views" class="bar" role="group"></span></div>
  <div class="bar" id="layers" role="group"></div>
  <div class="stage" id="stage">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" role="img"></svg>
  </div>
  <p class="note" id="note"></p>
</div>
<script src="/maps/maps.js?v=170398d877af"></script>
