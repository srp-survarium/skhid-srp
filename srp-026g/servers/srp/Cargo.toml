[package]
name = "srp"
version.workspace = true
edition.workspace = true
# `cargo run -p srp` is the server; the test bot is `--bin srp-bot`.
default-run = "srp"

[lints]
workspace = true

[features]
# TEST ONLY (`match-server`'s `bots/client_tests`): the client-test runner, with its lines for the owner sent to the game's chat.
client-test = ["match-server/client-test"]

[dependencies]
ctrlc = { workspace = true }
log = { workspace = true }

session = { workspace = true }
survarium = { workspace = true }
vostok = { workspace = true }

lobby-server = { path = "../lobby-server" }
login-server = { path = "../login-server" }
match-server = { path = "../match-server" }
web-server = { path = "../web-server" }

# The test bot's sign-in (`src/bot.rs`): TLS, as the client does it.
openssl = { workspace = true }
