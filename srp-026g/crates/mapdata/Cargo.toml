[package]
name = "mapdata"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
binary-config-parser = { workspace = true }
clap = { workspace = true }
# The archive reader: folder hard links, patches laid over one another.
resources-db = { workspace = true }
# The map table (map id -> project) for `mapdata-dump`.
survarium = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
artefact-carry = { path = "../artefact-carry" }

[[bin]]
name = "mapdata-dump"
path = "src/bin/mapdata-dump.rs"

[[bin]]
name = "mapdata-zones"
path = "src/bin/mapdata-zones.rs"
