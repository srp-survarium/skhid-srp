[package]
name = "session"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
survarium = { workspace = true }
argon2 = { workspace = true }
log = { workspace = true }
password-hash = { workspace = true }
rusqlite = { workspace = true }
# The finished matches' reports are kept as JSON (`v026g::rewards`).
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# A map the game data adds (`survarium::v026g::maps::fixtures`).
survarium = { workspace = true, features = ["fixtures"] }

[features]
# `create_session` without a sign-in, for other crates' tests (their
# dev-dependency turns it on); a server makes sessions only from a sign-in
# (`create_signed_in_session`).
test-support = []
