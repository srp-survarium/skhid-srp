[package]
name = "survarium"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
# Client patch 78 ends each player's state with the carry's snapshot
# (`v026g::match_msgs::motion`).
artefact-carry = { path = "../artefact-carry" }
# A weapon's upgrades packed as the client reads them (`v026g::weapon_kit`;
# the client's arena builds the same crate, patch 68).
weapon-kit = { workspace = true }
binary-config-parser = { workspace = true }
# The game's localizations are UTF-8 read as Windows-1251 (`v026g::localization`).
encoding_rs = { workspace = true }
resources-db = { workspace = true }
log = { workspace = true }
lzma-rust2 = { workspace = true }
# The lobby's results types are kept in srp's database as JSON
# (`session::v026g::rewards`).
serde = { workspace = true }
# The ED/EE mask and length, as the transport works them out (`v026g::match_msgs`).
udp-transport = { workspace = true }


[features]
# Game data made up for tests (`v026g::maps::fixtures`), for the tests of
# the crates that use this one.
fixtures = []

[dev-dependencies]
# The content edit lists, read by the modification tests
# (`v026g::modifications::tests`).
serde_json = { workspace = true }
