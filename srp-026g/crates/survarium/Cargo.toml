[package]
name = "survarium"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
binary-config-parser = { workspace = true }
# The game's localizations are UTF-8 read as Windows-1251 (`v026g::localization`).
encoding_rs = { workspace = true }
resources-db = { workspace = true }
log = { workspace = true }
lzma-rust2 = { workspace = true }
# The lobby's results types are kept in srp's database as JSON
# (`session::v026g::rewards`).
serde = { workspace = true }


[features]
# Game data made up for tests (`v026g::maps::fixtures`), for the tests of
# the crates that use this one.
fixtures = []
# What only the tests use: the kit and upgrade switches set for one thread (`v026g::loadouts::KitSwitches::scope`), so tests of
# the old kit and of the new run in one process. Enabled by the dev-dependencies of the crates whose tests need it.
test-support = []

[dev-dependencies]
# The content edit lists, read by the modification tests
# (`v026g::modifications::tests`).
serde_json = { workspace = true }
