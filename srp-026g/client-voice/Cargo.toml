[package]
name = "skhid-voice"
version.workspace = true
edition.workspace = true
build = "build.rs"

[lib]
name = "skhid_voice"
crate-type = ["rlib", "cdylib"]

[dependencies]
voice-abi = { path = "../crates/voice-abi" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_Security"] }

[lints]
workspace = true
