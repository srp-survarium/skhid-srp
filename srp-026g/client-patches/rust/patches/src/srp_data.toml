# Patch 94: srp's tables (gameplay/srp/<table>.options) for the lobby movie
# (srp_data.rs, SrpData.as). Only the decisions: which sites, and the
# handlers. The sites are sites_026g.tsv's; the logic is srp_data.rs.
name = "srp_data"
patch = 94

# game::on_configs_loaded once the configs and the dictionary are loaded: each
# table asked, once
[[hook]]
site = "configs.loaded"
handler = "on_configs"

# a table's query done: its keys and values kept
[[hook]]
site = "resources.config_done"
handler = "on_config"

# a frame of the lobby drawn: the lobby movie given every table, once (after
# the flight, the diagnostics' sweep and the lobby's scene: weapon_flight.toml,
# camera_sweep.toml, lobby_scene.toml)
[[hook]]
site = "lobby_camera.view"
handler = "on_frame"
order = 4
