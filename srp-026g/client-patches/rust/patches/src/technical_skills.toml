# Scavenger: after the ragdoll's death (order 1).
[[hook]]
site = "player.killed_event"
handler = "on_killed"
order = 2

# Trophy Trap: a disarmed own or enemy trap goes into the disarmer's trap pocket if it has room.
[[hook]]
site = "technical.trap_defused"
handler = "on_trap_defused"

# Bear Trap: a leg caught by a skilled owner's trap is left with no health; after the medical
# tree's pool refresh (order 1).
[[hook]]
site = "medical.wound"
handler = "on_wound"
order = 2
