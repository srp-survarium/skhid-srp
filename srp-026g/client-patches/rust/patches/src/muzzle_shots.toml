# Patch 200: a shot leaves the gun's muzzle, the way the gun looks
# (muzzle_shots.rs; docs/notes/muzzle-shots.md). Only the decisions: the site
# and the handler.
name = "muzzle_shots"
patch = 200

# instant_fire after its copy of the user's eyes' transform, before the
# spread: EAX the copy, EBX the weapon
[[hook]]
site = "weapon.shot_origin"
handler = "on_shot"

# after the frame's simulation: where the own player's gun looks
[[hook]]
site = "game_world.after_move"
handler = "on_after_move"
order = 9

# the camera the frame is drawn from
[[hook]]
site = "camera.apply"
handler = "on_camera"
order = 1

# the HUD each frame: its crosshair where the gun looks
[[hook]]
site = "player_icons.update_start"
handler = "on_hud"
order = 7
