# Patch 94: Scarcity (docs/notes/scarcity.md). Only the decisions: which
# site, and the handler. The sites (their VAs, kinds and spans) are
# sites_026g.tsv's; the logic is scarcity.rs. The options reads are patch
# 65's, 86's, 83's and 88's sites too: this patch's hooks come last there
# (order 4). The project's cook (create_game_objects' entry) is this
# patch's own.
name = "scarcity"
patch = 94

[[hook]]
site = "static_info.options_read"
handler = "on_static_info"
order = 4

[[hook]]
site = "replay.options_read"
handler = "on_replay_options"
order = 4

[[hook]]
site = "project.cook"
handler = "on_project_cook"
