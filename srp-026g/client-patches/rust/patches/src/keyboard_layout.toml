# Patch 107: chat and console text follow the keyboard layout the window was
# last told of (docs/notes/keyboard_layout.md). The sites are sites_026g.tsv's;
# the logic is keyboard_layout.rs and vostok/keyboard_layout.rs.
name = "keyboard_layout"
patch = 107

# message_processor's WM_INPUTLANGCHANGEREQUEST, before the text-focus check.
[[hook]]
site = "window.lang_request"
handler = "on_request"

# message_processor's WM_INPUTLANGCHANGE, before the same check.
[[hook]]
site = "window.lang_change"
handler = "on_change"

# keyboard::translate_text after its GetKeyboardLayout(0).
[[hook]]
site = "keyboard.text_layout"
handler = "on_text"

# message_processor's call of the text-focus check for a request: the
# console counts as a text input.
[[hook]]
site = "window.lang_focus"
handler = "on_request_focus"

# The game console shown and hidden.
[[hook]]
site = "console.opened"
handler = "on_console_opened"

[[hook]]
site = "console.closed"
handler = "on_console_closed"

# A key the console's text edit types: the keyboard's text, as the chat's.
[[hook]]
site = "console.char_typed"
handler = "on_console_char"
