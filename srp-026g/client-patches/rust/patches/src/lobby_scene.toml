# Patch 81: the lobby's scene follows the player's quest faction
# (docs/notes/lobby-scenes.md). Only the decisions: which sites, and the
# handlers. The sites are sites_026g.tsv's; the logic is lobby_scene.rs.
name = "lobby_scene"
patch = 81

[[hook]]
site = "configs.start"
handler = "on_configs_start"
order = 2                           # after patch 79's (language.toml)

[[hook]]
site = "lobby_client.faction"
handler = "on_faction"

[[hook]]
site = "lobby_menu.scene_request"
handler = "on_scene_request"

[[hook]]
site = "lobby_menu.scenes_ready"
handler = "on_scenes_ready"

[[hook]]
site = "lobby_menu.deactivate"
handler = "on_deactivate"

[[hook]]
site = "lobby_menu.activate"
handler = "on_activate"
