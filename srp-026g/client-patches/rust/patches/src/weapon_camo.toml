# Patch 44's part in the baker (client_patch.md section 3.41): a weapon's
# bake takes only the camouflage textures its patch names, never the
# surface's own `<diffuse>_camo...`. The site is sites_026g.tsv's; the logic
# is weapon_camo.rs; what is named, weapon_decals_026g.asm's fill.
name = "weapon_camo"
patch = 44
uses = ["bake_cache"]

# on_base_texture_loaded, a camouflage layer's texture with no name
[[hook]]
site = "bake.own_camouflage"
handler = "on_own_camouflage"

# Patch 44's bake_surface calls this generated entry for each surface, its
# parameters filled: the handler names the baked files.
[[hook]]
site = "weapon_camo.bake_name"
handler = "on_bake_name"
