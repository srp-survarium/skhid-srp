# Patch 123: every player drawn with srp's face of the account
# (docs/notes/face-choice.md). Only the decisions: which sites, and the
# handlers. The sites are sites_026g.tsv's; the logic is faces.rs. The
# options reads are patches 65's, 86's, 83's and 88's too: this patch's
# hooks run after theirs (order 4).
name = "faces"
patch = 123

[[hook]]
site = "skin_cook.head"
handler = "on_head"

[[hook]]
site = "lobby_client.own_account"
handler = "on_own_account"

[[hook]]
site = "lobby_client.squad_member"
handler = "on_squad_member"

[[hook]]
site = "static_info.options_read"
handler = "on_static_info"
order = 4

[[hook]]
site = "replay.options_read"
handler = "on_replay_options"
order = 4
