# Patch 156: the console command `collision` draws the level's collision
# geometry near the camera as lines, a colour a group (collision_view.rs;
# client_patch.md section 3.112). configs.start after patches 79, 83, 81, 88,
# 112, 133, 66 and 144 (orders 1 to 8); camera.viewed after patch 133; the two
# options reads after patches 154, 65, 86, 83, 88 (the replay's), 142, 123, 160
# and 214 (orders -1 to 7).
name = "collision_view"
patch = 156

# on_configs_loaded's start: the command put in the console's list
[[hook]]
site = "configs.start"
handler = "on_configs"
order = 9

# the options read: what the match shown allows (srp's private room entry,
# tag 8; a replay: allowed too)
[[hook]]
site = "static_info.options_read"
handler = "on_static_info"
order = 8

[[hook]]
site = "replay.options_read"
handler = "on_replay_options"
order = 8

# update_camera after the view's update: the lines near the eye made
[[hook]]
site = "camera.viewed"
handler = "on_viewed"
order = 2

# renderer::render's depth-tested debug lines: the lines drawn
[[hook]]
site = "render.debug_lines"
handler = "on_debug_lines"

# the command's object: a copy of cc_delegate's vtable, execute ours
[[vtable]]
name = "methods"
source = "cc_delegate_methods"
check = "check_collision_view_026g.py"

[[hook]]
site = "cc_delegate.execute"
handler = "on_execute"
proof = "collision through console_commands::execute"

# the mesh query's callback: a copy of btConvexTriangleCallback's vtable,
# processTriangle ours
[[vtable]]
name = "triangles"
source = "convex_triangle_callback_methods"
check = "check_collision_view_026g.py"

[[hook]]
site = "triangle_callback.process"
handler = "on_triangle"
proof = "a mesh's triangles through processAllTriangles' callback"
