# Patch 156: the console command `collision` draws the boxes of the level's
# collision near the camera, a colour a group (collision_view.rs;
# client_patch.md section 3.82). configs.start after patches 79, 83, 81, 88,
# 112, 133, 66 and 144 (orders 1 to 8); camera.viewed after patch 133.
name = "collision_view"
patch = 156

# on_configs_loaded's start: the command put in the console's list
[[hook]]
site = "configs.start"
handler = "on_configs"
order = 9

# update_camera after the view's update: the boxes near the eye read
[[hook]]
site = "camera.viewed"
handler = "on_viewed"
order = 2

# renderer::render's depth-tested debug lines: the boxes drawn
[[hook]]
site = "render.debug_lines"
handler = "on_debug_lines"

# the command's object: a copy of cc_delegate's vtable, execute ours
[[vtable]]
name = "methods"
source = "cc_delegate_methods"
check = "check_collision_view_026g.py"

[[hook]]
site = "cc_delegate.execute"
handler = "on_execute"
proof = "collision through console_commands::execute"
