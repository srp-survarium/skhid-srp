# Patch 210: the sync log, SKHID_SYNC_LOG=on (docs/notes/sync-log.md); in Freeze Tag also the
# minimap's verdict on the last one fighting, once a second. A line for each input
# applied, and each animation (and stamina) tick made, at a time off the 50 ms grid, and each
# world the server sends. It only reads. The sites are sites_026g.tsv's; the reads vostok/desync.rs.
name = "sync_log"
patch = 210

# apply_new_input's entry, before Freeze Tag's held exit (0) and patch 78's carry (1)
[[hook]]
site = "carry.input"
handler = "on_input"
order = -1

# base_player::tick_animations' entry (0x2D8EE0): it ticks the stamina too
[[hook]]
site = "sync.animations"
handler = "on_tick"

# game_world_core::deserialize's entry (0x2D2770): which load a replay is after
[[hook]]
site = "sync.world_load"
handler = "on_world_load"

# update_minimap_players' test of an enemy, before every patch's verdict (replay_map 1, Artifact
# Hunt 2, Freeze Tag 3): the map log's count of tests
[[hook]]
site = "minimap.enemy_spotted"
handler = "on_minimap_test"
order = -1

# update_minimap_players listing a player (0x23951B, where the test's shown exit goes)
[[hook]]
site = "sync.minimap_listed"
handler = "on_minimap_listed"

# each frame after the simulation's move, after Freeze Tag's (6) and the others: the map log's
# second, a line for each enemy of the viewer the rule shows on the map
[[hook]]
site = "game_world.after_move"
handler = "on_frame"
order = 9
