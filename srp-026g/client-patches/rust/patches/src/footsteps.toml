# Patch 101: a step first made by a re-simulation is heard (the players'
# random footstep drop-outs), and a foot step in a logic state with no foot
# material is dropped. The sites are sites_026g.tsv's; the logic is
# footsteps.rs and vostok/footstep.rs.
name = "footsteps"
patch = 101

# on_player_sound_event's test of the event's time against the newest
# played time (0x2A6485).
[[hook]]
site = "player_sound.step_guard"
handler = "on_step_guard"

# on_foot_step's read of the foot material by the logic state's movement id
# (0x2A6545): a state with none (movement 0) reads before the table.
[[hook]]
site = "player_sound.foot_material"
handler = "on_foot_material"
