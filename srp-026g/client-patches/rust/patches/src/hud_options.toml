# Patch 83: the hud's "Hide hit markers" and "Hide player scores", settings kept in
# user.cfg (docs/notes/hide-hit-markers-scores.md). Only the decisions:
# which sites, and the handlers. The sites are sites_026g.tsv's; the logic is
# hud_options.rs. Each site is another patch's too: this hook runs after it
# (patch 79's configs.start and options.callback, patch 65's
# player_icons.update_start, order 1; patch 65's static_info.options_read and
# replay.options_read, order 0). Order 2 everywhere: patch 86 takes 1 at the
# options reads.
name = "hud_options"
patch = 83

[[hook]]
site = "configs.start"
handler = "on_configs"
order = 2

# the process's start, before any Direct3D DLL is loaded: the renderer chosen,
# DXVK loaded from dxvk\ when picked (docs/notes/dxvk-option.md)
[[hook]]
site = "memory.allocate_arenas"
handler = "on_process_start"

# every Present of the game's swap chain, right before it: with DXVK, a window
# DXGI's flip model refuses (topmost, no frame style: DXVK's fullscreen) made a
# popup (docs/notes/dxvk-option.md, "The fullscreen window")
[[hook]]
site = "render_output.present"
handler = "on_present"
order = 1

# the engine's DirectDraw probe of the video memory, its number read: the
# DirectDraw object it never releases released, the GPU's own Direct3D driver
# with it (docs/notes/dxvk-option.md, "The address space (SRP-3)")
[[hook]]
site = "video_memory.ddraw_probed"
handler = "on_ddraw_probed"

[[hook]]
site = "options.callback"
handler = "on_options_call"
order = 2

[[hook]]
site = "player_icons.update_start"
handler = "on_update_icons"
order = 2

# the login screen shows (after patch 88's theme there): the renderer works,
# the DXVK marker written at configs.start goes (docs/notes/dxvk-option.md)
[[hook]]
site = "login_menu.activated"
handler = "on_login"
order = 2

[[hook]]
site = "static_info.options_read"
handler = "on_static_info"
order = 2

[[hook]]
site = "replay.options_read"
handler = "on_replay_options"
order = 2

# The render scale (docs/notes/dlss-option.md, "The render size"; hud_options/render_size.rs):
# the 3D frame at a share of the window's size. Written on demand, at the process's start,
# only when a scale is asked for (DLSS's link, or the diagnostics switch
# SKHID_DLSS_RENDER_SCALE): otherwise the engine's own code runs.
# set_size about to make the frame's targets: their size
[[hook]]
site = "render_window.targets_size"
handler = "on_targets_size"
install = "on_demand"

# a frame's start: a scale asked since the targets were made remakes them
[[hook]]
site = "render.output_setup"
handler = "on_output_setup"
install = "on_demand"

# the output set up: the stages' base viewport and depth-stencil are the frame's
[[hook]]
site = "render.output_set"
handler = "on_output_set"
install = "on_demand"

# the G-buffer's copy of the hardware depth to the linear one: from the frame's
[[hook]]
site = "gbuffer.depth_texture"
handler = "on_depth_texture"
install = "on_demand"

# before the screen image and Scaleform: the window's viewport and depth-stencil again
[[hook]]
site = "render.present_stage"
handler = "on_present_stage"
install = "on_demand"
