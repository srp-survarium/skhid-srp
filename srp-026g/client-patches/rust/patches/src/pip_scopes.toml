# Patch 198: picture-in-picture scopes (docs/notes/pip-scopes.md): with the
# setting srp_pip_scopes (or SKHID_PIP_SCOPES), or the probe SKHID_PIP_PROBE;
# nothing without them. The sites are sites_026g.tsv's; the logic is pip_scopes.rs,
# the engine's side vostok/second_view.rs.
name = "pip_scopes"
patch = 198
uses = ["hud_options"]

# game::tick before its scene's draw: the second view's draw first
[[hook]]
site = "game.draw_scene"
handler = "on_draw"

# each draw on the render thread: which view it is
[[hook]]
site = "render.begin"
handler = "on_render_begin"

# no interface in the second view's draw
[[hook]]
site = "render.flash_ui_call"
handler = "on_flash_ui_call"

# the frame's scene before the interface, before patches 152's and 176's
# (orders 1 and 2): the second view's picture in the corner
[[hook]]
site = "render.flash_ui"
handler = "on_interface"
order = 0

# no Present of the second view's window
[[hook]]
site = "render.present_call"
handler = "on_present"

# the moved models kept for the frame's own draw
[[hook]]
site = "render.unmove"
handler = "on_unmove"

# no first-person models in the second view
[[hook]]
site = "forward.execute_foreground"
handler = "on_foreground"

# the G-buffer's first-person surfaces, as the foreground's
[[hook]]
site = "gbuffer.models"
handler = "on_gbuffer"

# update_camera's zoom: the held optic, when magnified
[[hook]]
site = "camera.zoom"
handler = "on_zoom"

# the lens's weapon draws as an optic that does not hide it: no swap of
# its idle optic for the aimed one, its body and hands drawn and updated
# (each site's other branch, taken when the lens takes the weapon)
[[hook]]
site = "scope_draw.show"
handler = "on_scope_show"

[[hook]]
site = "scope_draw.body"
handler = "on_scope_body"

[[hook]]
site = "scope_draw.culled_body"
handler = "on_scope_culled_body"

# the swap: the aimed model put in the scene by the lens instead, for its
# reticle in the second view only
[[hook]]
site = "scope_draw.swap"
handler = "on_scope_swap"

[[hook]]
site = "scope_draw.optic"
handler = "on_scope_optic"

# the weapon put away: the lens's aimed model out of the scene with it
[[hook]]
site = "attachments.hidden"
handler = "on_weapon_hidden"
order = 2
