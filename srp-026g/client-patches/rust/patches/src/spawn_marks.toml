# The spawn marks, a tool of a local build (spawn_marks.rs; client_patch.md
# section 3.82): F7 the free-fly camera and back, F8 and F9 a mark of where
# the screen's camera is, a line of srp_spawn_marks.tsv each, F10 the map's
# last mark taken back; each mark of the map shown by a particle system where
# it is. It prints what patch 133's `where` prints, so it is that patch's.
# Only in a build made with `patch_026g.py --spawn-marks` (cfg
# srp_spawn_marks); in every other build the handlers are empty and none of
# the tool is in the arena.
name = "spawn_marks"
patch = 133
uses = ["console_where"]

# on_keyboard_action's start, after the replay's keys.
[[hook]]
site = "tab_cursor.key"
handler = "on_key"
order = 3

# every frame of a match, after the voice's: the markers follow the map
[[hook]]
site = "game_world.after_move"
handler = "on_frame"
order = 4

# the markers' particles' query: only the tool asks it
[[hook]]
site = "resources.query_done"
handler = "on_loaded"
