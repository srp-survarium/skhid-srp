name = "artefact_keeper"
patch = 109

# Keeper of the Artifacts (artefact-skills.md): the map's hidden pool as the core world
# registers it, and each player's tick giving a due Keeper its place's artefact of the match's
# kind once a match.
[[hook]]
site = "keeper.register"
handler = "on_register"

# every player's simulation tick (after the battery carrier's, Resonance's and the glow's)
[[hook]]
site = "battery.carrier_tick"
handler = "on_tick"
order = 4

# a spawn's setup_from_profile, before the on_taken of each held slot: a container whose
# artefact is in no inventory of this kit any more (a rollback over a gift into a kit that was not
# current) is emptied, as the world says
[[hook]]
site = "keeper.respawn_containers"
handler = "on_respawn_containers"
