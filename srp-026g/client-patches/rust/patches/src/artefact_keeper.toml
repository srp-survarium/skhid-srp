name = "artefact_keeper"
patch = 109

# Keeper of the Artifacts (artefact-skills.md): the map's hidden pool as the core world
# registers it, and each player's tick giving a due Keeper its place's artefact of the match's
# kind once a match.
[[hook]]
site = "keeper.register"
handler = "on_register"

# every player's simulation tick (after the battery carrier's, Resonance's and the glow's)
[[hook]]
site = "battery.carrier_tick"
handler = "on_tick"
order = 4

# the end of every world's load: every kit's artefact slots made the world's (a world holds the
# artefacts' inventory and slot, but only the current kit's inventory, and that only in its saved
# container range)
[[hook]]
site = "keeper.world_loaded"
handler = "on_world_loaded"
