# Patch 65: Blackout (docs/notes/blackout.md). Only the decisions: which
# site, and the handler. The sites (their VAs, kinds and spans) are
# sites_026g.tsv's; the logic is blackout.rs. Each site is Blackout's own, so
# patch 63 (team damage, at match_options::deserialize's end 0x1F0F30) and
# Research's markers (update_ui's call of update_player_icons 0x23B207) can
# land beside it unchanged. player_icons.update_start and the two options
# reads are patch 83's sites too, the options reads patch 86's too: their
# chains run this patch's hooks first (order 1 and 0).
name = "blackout"
patch = 65

[[hook]]
site = "static_info.options_read"
handler = "on_static_info"
order = 0

[[hook]]
site = "replay.options_read"
handler = "on_replay_options"
order = 0

[[hook]]
site = "player_icons.update_start"
handler = "on_update_icons"
order = 1

[[hook]]
site = "keyboard.tab_state"
handler = "on_tab"

[[hook]]
site = "input_builder.end"
handler = "on_input_end"

[[hook]]
site = "player_names.visibility"
handler = "on_name_visibility"
