# Patch 66: team voice chat (docs/notes/voice-chat.md). Only the decisions:
# which sites, and the handlers; the logic is voice.rs. configs.start after
# patches 79, 83, 81, 88, 112 and console_where (orders 1 to 6), game_world.after_move
# after patches 76, 87 and the medical skills (0 to 2); the game world's keys
# first of four (before patch 86's, which may take a key, 144's and 140's), the hud's calls after patches 86's and 144's;
# the game world's mouse buttons (push-to-talk on a button), taking none.
name = "voice"
patch = 66

[[hook]]
site = "configs.start"
handler = "on_configs"
order = 7

[[hook]]
site = "match_client.connect"
handler = "on_connect"

[[hook]]
site = "game_world.finish"
handler = "on_finish"

[[hook]]
site = "game_world.deactivate"
handler = "on_deactivate"

[[hook]]
site = "game_world.after_move"
handler = "on_frame"
order = 3

[[hook]]
site = "tab_cursor.key"
handler = "on_key"
order = 0

[[hook]]
site = "game_world.mouse_key"
handler = "on_mouse_key"

[[hook]]
site = "hud.callback"
handler = "on_hud_call"
order = 3
