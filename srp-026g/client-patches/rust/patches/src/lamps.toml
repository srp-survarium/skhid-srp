# Bullet decals: a glass mark inside a fixture's bounds is never queued.
[[hook]]
site = "bullet.decal_front"
handler = "on_decal_enter"
[[hook]]
site = "bullet.decal_back"
handler = "on_decal_leave"
[[hook]]
site = "bullet.decal_reflect"
handler = "on_decal_ricochet"
[[hook]]
site = "bullet.decal_collide"
handler = "on_decal_stop"

# Blasts: a grenade's or a trap's splash breaks the fixtures it reaches.
[[hook]]
site = "bullet_manager.explode"
handler = "on_explode"
