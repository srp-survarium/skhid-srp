# Patch 140: a replay's keys (docs/notes/replay-keys.md). Only the decisions:
# which site, and the handler. The site is sites_026g.tsv's; the logic is
# replay_keys.rs. The hook asks the game's network client whether it plays a
# replay (its class), as patch 135 does; a live match's keys go on untouched.
name = "replay_keys"
patch = 140

# on_keyboard_action's start, after the Tab cursor's.
[[hook]]
site = "tab_cursor.key"
handler = "on_key"
order = 2

# game_world::tick after the simulation's move: the places in the match, told
# to the movie when they change.
[[hook]]
site = "game_world.after_move"
handler = "on_move"
order = 2
