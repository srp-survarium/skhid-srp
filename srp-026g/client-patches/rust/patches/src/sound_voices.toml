# Patch 96: a refused sound takes the voice of a much quieter one
# (docs/notes/sound_voices.md). Only the decision: the site and the handler.
name = "sound_voices"
patch = 96

# calculate_hdr_audio_frame after create_sound_voice (the sound thread)
[[hook]]
site = "sound_scene.voice_made"
handler = "on_voice_made"

# source_voice_pool::acquire's walk bounded to one pass, as retail 0.46c2
# (0x8D1370), and a voice with no source not made (sound_voices_026g.asm)
[[hook]]
site = "sound_voice.pick"
source = "sound_voices_026g.asm"
symbol = "sound_voices_pick"
limit = 48

[[hook]]
site = "sound_voice.picked"
source = "sound_voices_026g.asm"
symbol = "sound_voices_picked"
limit = 24

[[hook]]
site = "sound_world.voice_built"
source = "sound_voices_026g.asm"
symbol = "sound_voices_built"
limit = 64
