# Patch 161: a weapon's parts, scope, eye, fire point, left hand and shells
# stand where its fitted modules put them (docs/notes/attachments.md, "The client's
# runtime"). Only the decisions: which sites, and the handlers. The sites
# (VAs, kinds, spans, what their registers hold) are sites_026g.tsv's; the
# logic is attachments.rs over the weapon-modules crate.
name = "attachments"
patch = 161

[[hook]]
site = "attachments.dictionary_requests"
handler = "on_dictionary_requests"

[[hook]]
site = "attachments.dictionary_configs"
handler = "on_dictionary_configs"

[[hook]]
site = "attachments.scope_dict"
handler = "on_scope_dict"

[[hook]]
site = "attachments.scope_result"
handler = "on_scope_result"

[[hook]]
site = "attachments.request_room"
handler = "on_request_room"

[[hook]]
site = "attachments.asked"
handler = "on_asked"

[[hook]]
site = "attachments.ready"
handler = "on_ready"

[[hook]]
site = "attachments.loaded"
handler = "on_loaded"

[[hook]]
site = "attachments.draw"
handler = "on_draw"
order = 0

[[hook]]
site = "attachments.culled"
handler = "on_culled"
order = 0

[[hook]]
site = "attachments.hidden"
handler = "on_hidden"
order = 0

[[hook]]
site = "attachments.hands"
handler = "on_hands"

[[hook]]
site = "attachments.fingers_view"
handler = "on_fingers_view"

[[hook]]
site = "attachments.shells"
handler = "on_shells"

[[hook]]
site = "attachments.release"
handler = "on_release"
order = 0

[[hook]]
site = "game.tick"
handler = "on_view_frame"
order = 7

[[hook]]
site = "weapon_view.camera"
handler = "on_view_camera"

[[hook]]
site = "weapon_view.no_gun"
handler = "on_view_no_gun"

[[hook]]
site = "weapon_view.submit"
handler = "on_view_submit"

[[hook]]
site = "weapon_view.begin"
handler = "on_view_begin"

[[hook]]
site = "weapon_view.end"
handler = "on_view_end"

[[hook]]
site = "weapon_view.foreground"
handler = "on_foreground"

# patch 206's second sight in the first person (attachments/sights.rs): the eye
# record blended between the two eyes, before patch 172 poses it (order 1)
[[hook]]
site = "hands_ik.aim_alignment"
handler = "on_sight_eye"
order = 0

# the world's zoom and near plane of the two sights' factors
[[hook]]
site = "sights.zoom"
handler = "on_sight_zoom"

# the main optic not looked through while the second sight is shown
[[hook]]
site = "sights.scope_view"
handler = "on_scope_view"
