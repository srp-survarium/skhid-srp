# Patch 153: a step whose body stands on something sounds, when on_step's
# ground ray meets nothing (docs/notes/footsteps.md, "Silent ground"), and a
# step in water wades ("Wading"). The site is sites_026g.tsv's; the logic is
# step_ground.rs and vostok/step.rs.
name = "step_ground"
patch = 153

# step_manager::on_step after its ground ray (0x248B5A): water over the
# ground wades; else the game's hit goes on as it is; a miss looks again, or
# takes a patch's armed ground (vostok::step::play).
[[hook]]
site = "step.ground"
handler = "on_ground"

# The step-down sweep's hits and answer (character controller, 0x84420 and
# 0x84FE0): what the controller touched, kept for the step (vostok::contact).
[[hook]]
site = "step_down.first"
handler = "on_sweep_first"

[[hook]]
site = "step_down.second"
handler = "on_sweep_second"

[[hook]]
site = "step_down.result"
handler = "on_sweep_result"

[[hook]]
site = "step_down.cached"
handler = "on_sweep_cached"
