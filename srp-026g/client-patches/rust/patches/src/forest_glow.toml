# Patch 110: Forest Protection's glow (docs/notes/artefact-skills.md, "Forest
# Protection"). Only the decisions: which sites, and the handlers. The sites
# are sites_026g.tsv's; the logic is forest_glow.rs.
name = "forest_glow"
patch = 110

# every player's simulation tick (after the battery carrier's): the glow
# played when the player shows it; the effect asked for at the first one
[[hook]]
site = "battery.carrier_tick"
handler = "on_tick"
order = 2

# the effect's query: the resource kept
[[hook]]
site = "resources.query_done"
handler = "on_loaded"

# the effect's cook: an instance for each of the 20 places (after Larkspur's)
[[hook]]
site = "medical.effect_capacity"
handler = "on_capacity"
order = 2

# the default clock: the glow ends when its player no longer shows it (after
# Medic's)
[[hook]]
site = "medical.effect_clock"
handler = "on_clock"
order = 2
