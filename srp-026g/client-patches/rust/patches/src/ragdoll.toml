# Patch 76: the death ragdoll (docs/notes/ragdoll.md). Only the decisions:
# which sites, and the handlers. The sites (their VAs, kinds, spans and
# registers) are sites_026g.tsv's; the game's functions and fields the
# handlers reach through vostok are engine_026g.tsv's and fields_026g.tsv's;
# the logic is ragdoll.rs, over the solver crate `ragdoll`.
name = "ragdoll"
patch = 76

# once a frame, after the simulation's move: the corpses stepped
[[hook]]
site = "game_world.after_move"
handler = "on_step"

# mt_draw's cull: a corpse of ours is always drawn (its bones move)
[[hook]]
site = "player_draw.cull"
handler = "on_cull"

# mt_draw, the bones made: the clip captured, a ragdoll's bones written
[[hook]]
site = "player_draw.bones"
handler = "on_bones"

# update_camera: the local player's ragdoll's eye
[[hook]]
site = "camera.eye"
handler = "on_eye"

# a bullet's ray traced: the corpses it crosses pushed, a living hit kept
[[hook]]
site = "bullet.ray_traced"
handler = "on_ray"

# mt_draw before the held item is read: a corpse of ours holding nothing (a
# battery carrier's once the battery drops; mt_draw makes no skeleton then)
# is posed from its ragdoll alone
[[hook]]
site = "player_draw.held_item"
handler = "on_held_item"
