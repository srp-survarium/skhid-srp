# Patch 83 (spike of dropped-weapon pickup): each match kit player's cook
# also cooks a spare, weapon-only inventory of its kit (vostok::spare), kept
# until that player is destroyed. The sites are sites_026g.tsv's; the logic
# is spare_weapons.rs. SRP_SPARE_WEAPONS=off cooks none (only measures).
name = "spare_weapons"
patch = 83

[[hook]]
site = "player_cook.query"
handler = "on_query"

[[hook]]
site = "player_cook.ready"
handler = "on_ready"

[[hook]]
site = "player.destroy"
handler = "on_destroy"
