# Patch 159: the console's output scrolls: the wheel, Page Up and Page Down;
# End, Enter and opening the console go back to the newest line
# (console_scroll.rs; docs/notes/console-scroll.md). Only the decisions: the
# sites and the handlers.
name = "console_scroll"
patch = 159

# console_impl::on_keyboard_action's start: every key of the open console
[[hook]]
site = "console.key"
handler = "on_key"

# game_console::on_mouse_move's start: every mouse move of the open console
[[hook]]
site = "console.wheel"
handler = "on_wheel"

# game_console::on_activate's start: the console about to be shown
[[hook]]
site = "console.activate"
handler = "on_activate"
