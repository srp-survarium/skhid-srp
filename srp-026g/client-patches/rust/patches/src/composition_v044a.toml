# Patch 178: the ported Londons' deferred composition is 0.44a5's: foliage lit
# through by the sun (composition_v044a.rs; README "The ported Londons'
# composition"). The sites are sites_026g.tsv's.
name = "composition_v044a"
patch = 178

# The map: a project whose config has srp_composition_v044a (after patch 130's).
[[hook]]
site = "project.insert"
handler = "on_project_insert"
order = 3
[[hook]]
site = "project.removed"
handler = "on_project_removed"
order = 3
[[hook]]
site = "project.destroy"
handler = "on_project_destroy"
order = 3

