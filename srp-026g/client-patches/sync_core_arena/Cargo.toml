# The sync core's client side (patch 74): linked into the exe's arena `.srpx`
# by link_026g.py, which builds it for i686 with -Zbuild-std=core, a static
# relocation model and fat LTO (one ELF32 object). Not a member of the
# workspace: it is built for the game, never for the host.
[package]
name = "sync_core_arena"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
sync-core = { path = "../../crates/sync-core" }

[profile.release]
panic = "abort"
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = false
incremental = false
overflow-checks = false
debug-assertions = false

[workspace]
