# srp for the Survarium 0.26g client, on a Linux host.
#
#   SRP_PUBLIC_HOST=203.0.113.9 docker compose up -d --build
#
# Made to run BESIDE the live 0.21d server (compose project `srp`, containers
# `srp-srp-1` / `srp-caddy-1`, image `srp:latest`, volume `srp_srp-data`,
# ports 80, 443, 1234 tcp+udp, 1235 tcp, 1236 udp, 127.0.0.1:8088) without
# touching it. Everything here has its own name and its own default port:
#
#   project   srp26           (containers srp26-srp26-1, srp26-caddy26-1)
#   image     srp-026g:latest
#   volumes   srp26_srp26-data (its own srp.db), srp26_caddy26-data
#   ports     2234/tcp login, 2235/udp lobby, 2236/udp match,
#             127.0.0.1:8098 web page
#
# The client is told the ports srp binds, so each game port is the same
# number inside and outside the container: change SRP26_LOGIN_PORT /
# SRP26_LOBBY_PORT / SRP26_MATCH_PORT, never the right-hand side alone. On a
# host of its own set them to the game's 1234 / 1235 / 1236.
#
# Open SRP26_LOGIN_PORT/tcp, SRP26_LOBBY_PORT/udp and SRP26_MATCH_PORT/udp in
# the host's firewall. Players start the game with
#   -server=<SRP_PUBLIC_HOST>:<SRP26_LOGIN_PORT>
# Settings and secrets go in a `.env` beside this file (see
# deploy/env-026g.example and docs/DEPLOY.md).
name: srp26
services:
  srp26:
    build: .
    image: srp-026g:latest
    restart: unless-stopped
    environment:
      # The address players reach the host at: an IPv4 address, or a name
      # that has one (the login answer has room for an address only; a name
      # is looked up once, at start).
      - SRP_PUBLIC_HOST=${SRP_PUBLIC_HOST:?set SRP_PUBLIC_HOST to the server's public IPv4 address or name}
      - SRP_LOGIN_PORT=${SRP26_LOGIN_PORT:-2234}
      - SRP_LOBBY_PORT=${SRP26_LOBBY_PORT:-2235}
      - SRP_MATCH_PORT=${SRP26_MATCH_PORT:-2236}
      # The admin page: on only with a token AND a path (a long random
      # name, served at /<SRP_ADMIN_PATH>), for these addresses only. On the
      # host itself Docker shows the bridge gateway, not 127.0.0.1; behind a
      # proxy set SRP_WEB_TRUST_PROXY=on and your own public IP here.
      - SRP_ADMIN_TOKEN=${SRP_ADMIN_TOKEN:-}
      - SRP_ADMIN_PATH=${SRP_ADMIN_PATH:-}
      - SRP_ADMIN_IPS=${SRP_ADMIN_IPS:-127.0.0.1}
      - SRP_WEB_TRUST_PROXY=${SRP_WEB_TRUST_PROXY:-off}
      # The home page's download: the zip srp hands out itself at /download
      # (5 at a time), read-only from ./download (SRP26_DOWNLOAD_DIR), or a
      # https link; and its checksum.
      - SRP_DOWNLOAD_FILE=${SRP_DOWNLOAD_FILE:-/srv/srp/download/Survarium-0.26g-srp-files.zip}
      # The server's game data (server-game-data.db, made by srp-game-data
      # build from resources.db and the patches the players mount): srp
      # takes every game table from it, offers its patches to the players'
      # updater at /patches, and does not start without it, nor when
      # SRP_MIN_PATCH_REVISION is under its newest patch or srp.db names an
      # item it lacks. Read once, at start: a release replaces the file,
      # sets SRP_MIN_PATCH_REVISION and recreates srp26
      # (`docker compose up -d --no-deps --force-recreate srp26`; a restart
      # keeps the old settings of .env).
      - SRP_GAME_DATA=${SRP_GAME_DATA:-/srv/srp/download/server-game-data.db}
      # Where the original game is had (the page's first step). The download
      # above is only the files that go over it.
      - SRP_GAME_URL=${SRP_GAME_URL:-https://archive.org/download/vostok_engine_v0.26g0_build_2777_internal_id_1104_jan_14_2015/survarium_full_026g0.7z}
      - SRP_DOWNLOAD_URL=${SRP_DOWNLOAD_URL:-}
      - SRP_DOWNLOAD_SHA256=${SRP_DOWNLOAD_SHA256:-}
      # The page of another server of ours: a link to it in the header of
      # every page (named as the other game version), or, on a test server,
      # in its notice as the players' server. https:// only; empty: no link.
      - SRP_OTHER_SERVER_URL=${SRP_OTHER_SERVER_URL:-}
      # `on`: every page says this is the test server (a badge, the title,
      # a notice that accounts here can be reset).
      - SRP_TEST_SERVER=${SRP_TEST_SERVER:-}
      # The worlds the match server accepted are kept here to compare.
      - SRP_SNAPSHOT_DIR=/srv/srp/data/snapshots
      # Every datagram of a match in and out, one file per match, kept when
      # SRP_RECORD_MIN_PLAYERS (default 6, late joiners counted) have entered
      # it; kept files over SRP_RECORD_MAX_MB (default 5000) together go
      # oldest first. `off`: no recordings.
      - SRP_RECORD_DIR=${SRP_RECORD_DIR:-/srv/srp/data/recordings}
      - SRP_RECORD_MIN_PLAYERS
      - SRP_RECORD_MAX_MB
      # "Watch replay" of the lobby's History (docs/notes/replay_watch.md):
      # a kept recording is made into the game's replay file in
      # SRP_REPLAY_DIR (a folder of its own, never inside the recordings')
      # when a player first asks for it, at the lowest CPU priority, and
      # handed out only at /replays/<token> of the web page. On by default:
      # SRP_GAME_MODES_DIR is a folder of the data volume holding the game's
      # gameplay/game_modes/*.options files (game data, copied there by
      # hand, those of every patch included); `off` or empty switches replays
      # off. Behind the caddy26 proxy set
      # SRP_WEB_TRUST_PROXY=on: failed /replays/ lookups are limited per
      # address.
      - SRP_REPLAY_DIR=${SRP_REPLAY_DIR:-/srv/srp/data/replays}
      - SRP_GAME_MODES_DIR=${SRP_GAME_MODES_DIR-/srv/srp/data/game_modes}
      - SRP_REPLAY_MAX_RECORDING_MB
      # Replays (.sur and .json) over this many MB together: the oldest go
      # (default 1000; apart from SRP_RECORD_MAX_MB).
      - SRP_REPLAY_MAX_MB
      # The server's log, one file per UTC day, in the data volume: it
      # outlives the container, which an update makes anew (the container's
      # own output, `docker compose logs`, is gone then). Files older than
      # SRP_LOG_KEEP_DAYS (default 14) are deleted.
      - SRP_LOG_DIR=/srv/srp/data/logs
      - SRP_LOG_KEEP_DAYS
      - RUST_LOG=${RUST_LOG:-info}
      # Passed on only when set in the shell or in `.env` (unset: srp's own
      # defaults; see SRP-026G.md for each).
      - SRP_REGISTRATION
      - SRP_SIGN_INS_PER_MINUTE
      - SRP_REGISTRATIONS_PER_DAY
      - SRP_MATCH_GATHER_SECONDS
      - SRP_MATCH_FILL_PLAYERS
      - SRP_MATCH_QUIET_SECONDS
      - SRP_MATCH_MIN_PLAYERS
      - SRP_MATCH_JOIN_EXTENSION_SECONDS
      - SRP_MATCH_MAX_COUNTDOWN_SECONDS
      - SRP_MATCH_TEAM_SIZE
      - SRP_BALANCE_PLAYER
      - SRP_BALANCE_PLAYER_LEVEL
      - SRP_BALANCE_RATING
      - SRP_BALANCE_TRUST_MATCHES
      - SRP_BALANCE_RATED_PLAYERS
      - SRP_BALANCE_BATTERY_LEAD
      - SRP_BALANCE_TICKET_LEAD
      - SRP_BALANCE_DRAMATIC_LEAD
      - SRP_LATE_JOIN_PATIENCE_SECONDS
      - SRP_GROWING_MIN_PLAYERS
      - SRP_GROWING_GATHER_SECONDS
      - SRP_GROWING_POPULATION_EXPONENT
      - SRP_SQUADS
      - SRP_SQUADS_OFF_TEXT
      - SRP_SQUAD_SIZE
      - SRP_SQUAD_FULL_TEXT
      - SRP_MIN_PATCH_REVISION
      - SRP_MATCH_MODES
      - SRP_MATCH_MAPS
      - SRP_MATCH_MAP_SKEW
      - SRP_LOBBY_LINK_TIMEOUT_SECONDS
      - SRP_EXPERIENCE_RATE
      - SRP_MONEY_RATE
      - SRP_REPUTATION_RATE
      - SRP_CLAN_COST
      - SRP_CLAN_PLAYERS_REQUIRED
      - SRP_CLAN_MAX_MEMBERS
      - SRP_LATE_INPUTS
      - SRP_CLOCK_CORRECTION
      - SRP_CHECK_INITIAL_WORLD
      - SRP_COMPRESS_STATE
      - SRP_ENTRY_STATE_SECONDS
      - SRP_RELAY_PACK_MS
      - SRP_PACKET_LOG
      # "Player vs Bots" (the lobby's `pvb.rs`; on here, `off` in .env to
      # switch it off; the code's own default is off). Each match against
      # bots may hold a bots' map of its own in memory (35-150 MB, up to
      # SRP_PVB_MAX_MATCHES maps): raise SRP26_MEMORY with it.
      - SRP_PVB=${SRP_PVB:-on}
      - SRP_PVB_MAX_GEAR
      - SRP_PVB_MAX_MATCHES
      - SRP_PVB_PAY
      - SRP_PVB_STALL_S
      # The bots' maps (docs/notes/player_bots_mapdata.md section 6): the
      # <project>.mapdata files, game data copied by hand into the data
      # volume. The grids and trees the server builds of them are written
      # to <dir>/built (SRP_MAPDATA_BUILT) and read from there next time. A
      # folder that is not there: bots without maps (a warning), as `off`.
      - SRP_MAPDATA_DIR=${SRP_MAPDATA_DIR-/srv/srp/data/mapdata}
      - SRP_MAPDATA_BUILT
      - SRP_MAPDATA_KEEP
      - SRP_MAPDATA_AT_ONCE
    ports:
      # Login: TLS over TCP.
      - "${SRP26_LOGIN_PORT:-2234}:${SRP26_LOGIN_PORT:-2234}/tcp"
      # Lobby and match server: UDP (0.26g has no TCP lobby, no browser
      # server on 80 and no presence pings).
      - "${SRP26_LOBBY_PORT:-2235}:${SRP26_LOBBY_PORT:-2235}/udp"
      - "${SRP26_MATCH_PORT:-2236}:${SRP26_MATCH_PORT:-2236}/udp"
      # The web page (home, launcher, admin) is plain HTTP: this host only. Reach
      # it through an SSH tunnel, or put HTTPS in front (the caddy26 service
      # below, on a host whose 443 is free).
      - "127.0.0.1:${SRP26_WEB_PORT:-8098}:8088/tcp"
    volumes:
      # Its own database: never the 0.21d server's volume.
      - srp26-data:/srv/srp/data
      - ${SRP26_DOWNLOAD_DIR:-./download}:/srv/srp/download:ro
    # Keeps what the game does not need away from it.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: ${SRP26_MEMORY:-512m}
    cpus: ${SRP26_CPUS:-1}
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # The web page's port answers while the process lives (the lobby and the
    # match server are UDP; a connection that sends nothing is dropped
    # without a log line).
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8088' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
  # HTTPS for the web page, ONLY on a host whose port 443 is free:
  #   docker compose --profile tls up -d
  # with SRP_WEB_DOMAIN set to a name that points at this host, or to
  # several with commas between them ("skhid.link, www.skhid.link"); the
  # certificates come by TLS-ALPN on 443. Where another web server has 443,
  # do not start this (see DEPLOY.md for the choices).
  caddy26:
    profiles: [tls]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      - SRP_WEB_NAMES=${SRP_WEB_DOMAIN:-set-SRP_WEB_DOMAIN.invalid}
    # A site of all the names, written at start (the root is read-only).
    command:
      - sh
      - -c
      - >-
        printf '%s {\n\treverse_proxy srp26:8088\n}\n' "$$SRP_WEB_NAMES" > /tmp/Caddyfile
        && exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    ports:
      - "${SRP26_HTTPS_PORT:-443}:443/tcp"
    volumes:
      - caddy26-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    pids_limit: 128
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    depends_on: [srp26]
volumes:
  srp26-data:
  caddy26-data:
