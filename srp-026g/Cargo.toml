[workspace]
members = [
  "crates/binary-config-parser",
  "crates/mapdata",
  "crates/resources-db",
  "crates/session",
  "crates/survarium",
  "crates/udp-transport",
  "crates/vostok",

  "servers/lobby-server",
  "servers/login-server",
  "servers/match-server",
  "servers/srp",
  "servers/web-server",

  "scripts/binary-config-cli",      # Parser for binary config files
  "scripts/build-engine-structure", # IDA helper for buidling directory structure based on C++ namespaces
  "scripts/nasm-decompiler",        # Patcher for `survarium.exe`
  "scripts/parse-journal-file",     # Parser for .journal files available in ~0.20 versions
]
exclude = []
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.clippy]
new_without_default = "allow"
# Parallel arrays indexed by one place, slot or event number read better as an index loop.
needless_range_loop = "allow"

[workspace.dependencies]
arrayref = "0.3.9" # TODO: Remove
bytemuck = { version = "1.23.1", features = ["derive", "min_const_generics"] }
clap = { version = "4.5.41", features = ["derive", "env"] }
crc32fast = "1.4.2"
encoding_rs = "0.8.35"
iced-x86 = "1.21.0"
# The replay conversion thread's lowest priority on Linux (`setpriority`).
libc = "0.2"
# The world snapshot 0xE8 goes out as real LZMA2 (`survarium::v026g::lzma2`).
lzma-rust2 = { version = "0.22", default-features = false, features = ["std", "encoder", "optimization"] }
num-derive = "0.4" # TODO: Remove
num-traits = "0.2" # TODO: Remove
openssl = "0.10"
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["getrandom"] }
rusqlite = { version = "0.37", features = ["bundled"] }
ctrlc = { version = "3.4", features = ["termination"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["std"] }
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
thiserror = "2.0.12"

actix-web = "4.10.2"
env_logger = "0.10"
log = "0.4"
sqlx = { version = "0.8", features = [ "runtime-tokio" ] }

binary-config-parser = { path = "crates/binary-config-parser" }
resources-db = { path = "crates/resources-db" }
# The mapdata dump's reader of the shipped archive (hard links resolved);
# kept beside the in-tree crate above under its own name.
vostok-resources-db = { package = "resources-db", git = "https://github.com/srp-survarium/vostok-resources-db", rev = "9498aca14014ef74460429f51eb41a6af333522c" }
session = { path = "crates/session" }
survarium = { path = "crates/survarium" }
udp-transport = { path = "crates/udp-transport" }
vostok = { path = "crates/vostok" }

# Password hashing runs in srp's debug build too: unoptimized, argon2 takes
# seconds a sign-in.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
