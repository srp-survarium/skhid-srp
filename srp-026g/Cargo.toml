[workspace]
members = [
  "crates/ban-reason",
  "crates/sign-in-cipher",
  "crates/binary-config-parser",
  "crates/client-body",
  "crates/mapdata",
  "crates/mapdata-srchash",
  "crates/research-rule",
  "crates/artefact-hunt-rule",
  "crates/resources-db",
  "crates/session",
  "crates/artefact-carry",
  "crates/weapon-pickup",
  "crates/second-sight",
  "crates/technical-skills",
  "crates/ragdoll",
  "crates/voice-abi",
  "client-voice",
  "crates/survarium",
  "crates/udp-transport",
  "crates/vostok",
  "crates/weapon-kit",
  "crates/weapon-modules",
  "crates/srp-validate",
  "crates/world-frame",

  "servers/lobby-server",
  "servers/login-server",
  "servers/match-server",
  "servers/srp",
  "servers/web-server",

  "scripts/binary-config-cli",      # Parser for binary config files
  "scripts/ffa-mode/check-points",  # FFA spawn points against the maps' collision
  "scripts/stalker-maps/ffa-points", # STALKER maps' FFA spawn planner
]
exclude = []
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.clippy]
new_without_default = "allow"
# Parallel arrays indexed by one place, slot or event number read better as an index loop.
needless_range_loop = "allow"
# srp-validate's views are no_std and allocation-free: a state's largest
# variant cannot be boxed, and each view is built once in place.
large_enum_variant = "allow"
# New in clippy since nightly-2026-07-12. srp-validate is also linked into the game's exe arena (patch 87): rewriting its chunk
# loops as `as_chunks` would change the arena's code for no gain, and a toolchain bump must leave the exe's code as it was.
chunks_exact_to_as_chunks = "allow"

[workspace.dependencies]
arrayref = "0.3.9" # TODO: Remove
bytemuck = { version = "1.23.1", features = ["derive", "min_const_generics"] }
clap = { version = "4.5.41", features = ["derive", "env"] }
crc32fast = "1.4.2"
encoding_rs = "0.8.35"
# The replay conversion thread's lowest priority on Linux (`setpriority`).
libc = "0.2"
# The world snapshot 0xE8 goes out as real LZMA2 (`survarium::v026g::lzma2`).
lzma-rust2 = { version = "0.22", default-features = false, features = ["std", "encoder", "optimization"] }
num-derive = "0.4" # TODO: Remove
num-traits = "0.2" # TODO: Remove
openssl = "0.10"
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["getrandom"] }
rusqlite = { version = "0.37", features = ["bundled"] }
ctrlc = { version = "3.4", features = ["termination"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["std"] }
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
thiserror = "2.0.12"
# `mapdata-srchash`: the source digests of the grid builder, from its items' tokens (the versions Cargo.lock already has).
proc-macro2 = "1.0.97"
quote = "1.0.40"
syn = { version = "2.0.105", features = ["full"] }

log = "0.4"

binary-config-parser = { path = "crates/binary-config-parser" }
resources-db = { path = "crates/resources-db" }
artefact-hunt-rule = { path = "crates/artefact-hunt-rule" }
ban-reason = { path = "crates/ban-reason" }
sign-in-cipher = { path = "crates/sign-in-cipher" }
session = { path = "crates/session" }
srp-validate = { path = "crates/srp-validate" }
survarium = { path = "crates/survarium" }
udp-transport = { path = "crates/udp-transport" }
vostok = { path = "crates/vostok" }
world-frame = { path = "crates/world-frame" }
weapon-kit = { path = "crates/weapon-kit" }
weapon-modules = { path = "crates/weapon-modules" }

# The release build (servers, grid builds, benches) as one codegen unit with
# fat LTO: cross-crate inlining into the bots' hot paths (mapdata's casts and
# searches called from match-server). Bots' thread CPU on real_bot_cost 5-10 %
# lower, decisions identical. Dev and test builds keep their defaults.
[profile.release]
lto = "fat"
codegen-units = 1

# Password hashing runs in srp's debug build too: unoptimized, argon2 takes
# seconds a sign-in.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
