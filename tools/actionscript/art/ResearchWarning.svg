<svg xmlns="http://www.w3.org/2000/svg" width="54" height="53" viewBox="0 0 54 53">
  <defs>
    <filter id="edge" x="0" y="0" width="54" height="53" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="1.3" result="outline"/>
      <feGaussianBlur in="outline" stdDeviation="2.2" result="soft"/>
      <feFlood flood-color="#000" flood-opacity=".85" result="black"/>
      <feComposite in="black" in2="soft" operator="in" result="shadow"/>
      <feFlood flood-color="#000" result="solidBlack"/>
      <feComposite in="solidBlack" in2="outline" operator="in" result="rim"/>
      <feGaussianBlur in="rim" stdDeviation=".65" result="softRim"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation=".3" result="softWhite"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="softRim"/><feMergeNode in="softWhite"/></feMerge>
    </filter>
  </defs>
  <!-- The retail swords use a 54x53 canvas, with white edges at y=10..42.
       Keep that registration, padding and an approximately 7px stroke weight. -->
  <g fill="#fff" filter="url(#edge)">
    <path d="M24 10H30L31 11 29.5 32 28.5 33H25.5L24.5 32 23 11Z"/>
    <circle cx="27" cy="39.5" r="3.5"/>
  </g>
</svg>
